name: 自动拉取上游汉化并构建推送 Docker 镜像

on:
  push:
    branches:
      - main
    paths:
      - '规则/**'
      - '脚本/**'
      - '.github/workflows/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '指定上游发布版本 Tag (留空则默认拉取上游最新 Release)'
        required: false
        default: ''
      push_image:
        description: '是否推送镜像到 Docker Hub'
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出汉化流水线仓库
        uses: actions/checkout@v4

      - name: 2. 初始化 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 3. 安装流水线依赖
        run: npm ci || npm install

      - name: 4. 获取上游最新 Release 版本并克隆源码
        id: upstream
        run: |
          if [ -n "${{ github.event.inputs.upstream_tag }}" ]; then
            TAG="${{ github.event.inputs.upstream_tag }}"
          else
            # 从 GitHub API 获取 Finsys/dockhand 最新 Release Tag
            TAG=$(curl -sL https://api.github.com/repos/Finsys/dockhand/releases/latest | jq -r '.tag_name // empty')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              TAG="v1.0.46"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          CLEAN_VER="${TAG#v}"
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "🚀 目标上游版本: $TAG (纯版本号: $CLEAN_VER)"

          # 克隆指定版本的上游源码到 代码/ 目录
          git clone --depth 1 --branch "$TAG" https://github.com/Finsys/dockhand.git 代码

      - name: 5. 执行精准汉化流水线 (apply)
        run: |
          npm run apply

      - name: 6. 在 output 目录生成跨平台完整 package-lock.json
        run: |
          cd output
          npm install --package-lock-only --ignore-scripts

      - name: 7. 设置 QEMU (用于多架构跨平台编译)
        uses: docker/setup-qemu-action@v3

      - name: 8. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 9. 登录 Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 10. 生成镜像标签元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_REPO || 'kowming/dockhand' }}
          tags: |
            type=raw,value=zh

      - name: 11. 构建并推送多架构 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./output
          file: ./output/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') && secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
