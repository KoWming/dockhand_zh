name: Dockhand 多架构分阶段构建与发布

on:
  push:
    branches: [ main ]
    paths:
      - '规则/**'
      - '脚本/**'
      - '.github/workflows/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '上游版本 Tag (留空则默认拉取官方最新 Release)'
        required: false
        default: ''

jobs:
  # =========================================================================
  # 阶段一：拉取上游源码 -> 执行汉化 -> 在宿主机原生极速编译前端 (彻底免除容器内 OOM)
  # =========================================================================
  prepare:
    name: 阶段一：汉化与云端宿主机预编译
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出流水线仓库
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 24.18.1 稳定运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: 3. 安装流水线工具依赖
        run: npm install

      - name: 4. 获取上游 Release 源码
        run: |
          TAG="${{ github.event.inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -sL https://api.github.com/repos/Finsys/dockhand/releases/latest | jq -r '.tag_name // "v1.0.46"')
          fi
          echo "🚀 目标上游版本: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/Finsys/dockhand.git 代码

      - name: 5. 执行汉化流水线 (写入 output)
        run: npm run apply

      - name: 6. 在云端宿主机安装依赖并执行编译
        run: |
          cd output
          npm install
          npm run build
          # 仅在 CI 环境中放行预编译产物传入 Docker，并跳过容器内二次构建
          sed -i '/^build\/$/d' .dockerignore
          sed -i 's/RUN npm run build/RUN if [ -f "build\/index.js" ]; then echo "--> [CI] 复用预编译产物"; else npm run build; fi/' Dockerfile
          # 清理宿主机的 node_modules，保持 artifact 轻量 (仅 ~25MB)，容器构建时会按各架构自行组装
          rm -rf node_modules

      - name: 7. 归档上传已完成汉化与编译的产物
        uses: actions/upload-artifact@v4
        with:
          name: localized-build-output
          path: output/
          retention-days: 1

  # =========================================================================
  # 阶段二：构建 linux/amd64 镜像 (直接复用阶段一的 build/，跳过前端编译)
  # =========================================================================
  build-amd64:
    name: 阶段二：组装并推送 amd64 镜像
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 下载阶段一已完成编译的产物
        uses: actions/download-artifact@v4
        with:
          name: localized-build-output
          path: output/

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 组装并推送 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./output
          file: ./output/Dockerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dockhand:amd64-temp
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # =========================================================================
  # 阶段三：构建 linux/arm64 镜像 (免除 QEMU 前端慢速模拟，仅需编译 Go 与 C++)
  # =========================================================================
  build-arm64:
    name: 阶段三：组装并推送 arm64 镜像
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 下载阶段一已完成编译的产物
        uses: actions/download-artifact@v4
        with:
          name: localized-build-output
          path: output/

      - name: 设置 QEMU 仿真环境
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 组装并推送 arm64 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./output
          file: ./output/Dockerfile
          platforms: linux/arm64
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dockhand:arm64-temp
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # =========================================================================
  # 阶段四：合并发布多架构清单为统一定名标签 (kowming/dockhand:zh)
  # =========================================================================
  publish-manifest:
    name: 阶段四：发布统一多架构清单
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 汇合 amd64 与 arm64 镜像并发布统一定名标签
        run: |
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          docker buildx imagetools create \
            -t docker.io/${USER}/dockhand:zh \
            docker.io/${USER}/dockhand:amd64-temp \
            docker.io/${USER}/dockhand:arm64-temp

          echo "🎉 多架构统一镜像发布成功: docker.io/${USER}/dockhand:zh"
