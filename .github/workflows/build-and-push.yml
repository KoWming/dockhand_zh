name: 自动拉取上游汉化并构建推送 Docker 镜像

on:
  push:
    branches:
      - main
    paths:
      - '规则/**'
      - '脚本/**'
      - '.github/workflows/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '指定上游发布版本 Tag (留空则默认拉取上游最新 Release)'
        required: false
        default: ''
      platform:
        description: '构建目标平台架构 (可选: all / amd64 / arm64)'
        required: false
        default: 'amd64'
      push_image:
        description: '是否推送镜像到 Docker Hub'
        type: boolean
        default: true

jobs:
  # 阶段一：拉取上游源码并执行非侵入式汉化流水线
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: 1. 检出汉化流水线仓库
        uses: actions/checkout@v4

      - name: 2. 初始化 Node.js 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 3. 安装流水线依赖
        run: npm ci || npm install

      - name: 4. 获取上游 Release 版本并克隆源码
        id: upstream
        run: |
          if [ -n "${{ github.event.inputs.upstream_tag }}" ]; then
            TAG="${{ github.event.inputs.upstream_tag }}"
          else
            TAG=$(curl -sL https://api.github.com/repos/Finsys/dockhand/releases/latest | jq -r '.tag_name // empty')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              TAG="v1.0.46"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          CLEAN_VER="${TAG#v}"
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "🚀 目标上游版本: $TAG (纯版本号: $CLEAN_VER)"

          git clone --depth 1 --branch "$TAG" https://github.com/Finsys/dockhand.git 代码

      - name: 5. 执行汉化流水线 (生成 output 产物)
        run: npm run apply

      - name: 6. 在 output 目录生成锁定文件
        run: |
          cd output
          npm install --package-lock-only --ignore-scripts

      - name: 7. 打包缓存汉化产物
        uses: actions/upload-artifact@v4
        with:
          name: localized-output
          path: output/
          retention-days: 1

  # 阶段二：分架构独立执行构建 (每个架构独占独立虚拟机与全额内存，彻底规避 OOM)
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 当输入选择 amd64 时仅跑 amd64，选择 arm64 时仅跑 arm64，选择 all 或代码 push 时跑全部
        platform: >-
          ${{
            (github.event.inputs.platform == 'amd64' && fromJSON('["linux/amd64"]')) ||
            (github.event.inputs.platform == 'arm64' && fromJSON('["linux/arm64"]')) ||
            fromJSON('["linux/amd64", "linux/arm64"]')
          }}
    steps:
      - name: 1. 扩展虚拟机物理 Swap 交换空间 (防 OOM 关键保障)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 2. 下载汉化产物
        uses: actions/download-artifact@v4
        with:
          name: localized-output
          path: output/

      - name: 3. 设置 QEMU 仿真环境
        uses: docker/setup-qemu-action@v3

      - name: 4. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 5. 登录 Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 6. 确定单架构镜像标签
        id: tag_info
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "platform_tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: 7. 单独构建当前架构镜像并推送独立 Digest
        uses: docker/build-push-action@v6
        with:
          context: ./output
          file: ./output/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') && secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_REPO || 'kowming/dockhand' }}:${{ steps.tag_info.outputs.platform_tag }}
          cache-from: type=gha,scope=${{ steps.tag_info.outputs.platform_tag }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag_info.outputs.platform_tag }}

  # 阶段三：合并多架构 Manifest 清单为统一定名标签 (kowming/dockhand:zh)
  merge-manifests:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.push_image == 'true') && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: 1. 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 2. 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: 3. 组合并发布统一 Manifest
        run: |
          REPO="${{ secrets.DOCKERHUB_REPO || 'kowming/dockhand' }}"
          TAG="zh"
          
          # 判断参与合并的镜像分支
          if [ "${{ github.event.inputs.platform }}" = "amd64" ]; then
            docker buildx imagetools create -t ${REPO}:${TAG} ${REPO}:linux-amd64
          elif [ "${{ github.event.inputs.platform }}" = "arm64" ]; then
            docker buildx imagetools create -t ${REPO}:${TAG} ${REPO}:linux-arm64
          else
            docker buildx imagetools create -t ${REPO}:${TAG} ${REPO}:linux-amd64 ${REPO}:linux-arm64
          fi

          echo "🎉 多架构镜像清单发布成功: ${REPO}:${TAG}"
